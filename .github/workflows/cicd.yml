name: cicd

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: cicd-front-main
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}
      owner: ${{ steps.lower.outputs.owner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Repository owner lowercase
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set image metadata
        id: meta
        run: echo "image=ghcr.io/${{ steps.lower.outputs.owner }}/ion-front:latest" >> $GITHUB_OUTPUT

      - name: Log in GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} << EOF
            set -e

            echo "Pulling image: $IMAGE"
            docker pull $IMAGE

            echo "Recreating ion-front (nginx 80/443, HTTPS)..."
            docker stop ion-front || true
            docker rm ion-front || true

            docker run -d --name ion-front \
              --network ion-net \
              --restart unless-stopped \
              -p 80:80 -p 443:443 \
              -v le-certs:/etc/letsencrypt \
              -v le-webroot:/var/www/certbot \
              $IMAGE

            echo "Pruning dangling images..."
            docker image prune -f || true

            echo "Done."
          EOF
